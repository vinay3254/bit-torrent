[package]
name = "bittorrent-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
rand = "0.8"
url = "2.5"
hex = "0.4"
